<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" style="background:#f1f5f9; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- M.2 SSD PCB Body -->
  <rect x="70" y="80" width="260" height="120" rx="6" fill="url(#pcb)" stroke="#475569" stroke-width="2" shadow="0 10px 15px rgba(0,0,0,0.2)"/>
  
  <!-- Screw hole at right end -->
  <circle cx="310" cy="140" r="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="310" cy="140" r="16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Gold Connector Pins on Left End -->
  <g fill="url(#gold)">
    <rect x="66" y="88" width="8" height="6" rx="1"/>
    <rect x="66" y="98" width="8" height="6" rx="1"/>
    <rect x="66" y="108" width="8" height="6" rx="1"/>
    <!-- Key Notch -->
    <rect x="66" y="126" width="8" height="6" rx="1"/>
    <rect x="66" y="136" width="8" height="6" rx="1"/>
    <rect x="66" y="146" width="8" height="6" rx="1"/>
    <rect x="66" y="156" width="8" height="6" rx="1"/>
    <rect x="66" y="166" width="8" height="6" rx="1"/>
    <rect x="66" y="176" width="8" height="6" rx="1"/>
    <rect x="66" y="186" width="8" height="6" rx="1"/>
  </g>

  <!-- Flash Memory Chips -->
  <rect x="230" y="92" width="55" height="45" rx="3" fill="url(#chip)" stroke="#475569" stroke-width="1"/>
  <rect x="230" y="144" width="55" height="45" rx="3" fill="url(#chip)" stroke="#475569" stroke-width="1"/>
  <text x="257" y="118" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="monospace">NAND FLASH</text>
  <text x="257" y="170" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="monospace">NAND FLASH</text>

  <!-- Controller Chip -->
  <rect x="90" y="110" width="35" height="60" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="107" y="143" font-size="8" fill="#38bdf8" text-anchor="middle" font-weight="bold">NVMe</text>

  <!-- Main Label Sticker -->
  <rect x="135" y="95" width="85" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="135" y="95" width="85" height="18" rx="4" fill="#0284c7"/>
  <text x="177" y="108" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SOLID STATE DRIVE</text>
  
  <text x="177" y="132" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">SSD</text>
  <text x="177" y="148" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">M.2 NVMe 500GB</text>
  
  <line x1="143" y1="156" x2="212" y2="156" stroke="#e2e8f0" stroke-width="1"/>
  <text x="177" y="170" font-size="8" fill="#64748b" text-anchor="middle">High Speed Storage</text>
  <text x="177" y="179" font-size="8" fill="#64748b" text-anchor="middle">PCIe Gen4 x4</text>

  <!-- Caption badge at bottom -->
  <rect x="110" y="235" width="180" height="32" rx="16" fill="#1e293b" shadow="0 4px 6px rgba(0,0,0,0.1)"/>
  <text x="200" y="255" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ SSD (Solid State Drive)</text>
</svg>
